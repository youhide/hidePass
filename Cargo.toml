[package]
name = "hidepass"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "A pass-compatible password manager: same store, same gpg keys, more features."
license = "MIT"
repository = "https://github.com/youhide/hidePass"
readme = "README.md"
keywords = ["password", "pass", "gpg", "password-store", "cli"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
anyhow = "1.0.104"
bech32 = "0.12.0"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
data-encoding = "2.11.1"
getrandom = "0.4.3"
hmac = "0.13.0"
k256 = { version = "0.14.0", default-features = false, features = ["arithmetic", "std"] }
libc = "0.2.189"
pbkdf2 = "0.13.0"
qrcode = "0.14.1"
regex = "1.13.1"
ripemd = "0.2.0"
rpassword = "7.5.4"
sha1 = "0.11.0"
sha2 = "0.11.0"
sha3 = "0.12.0"
signal-hook = "0.4.4"
tempfile = "3.27.0"
zeroize = "1.9.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSArray"] }
