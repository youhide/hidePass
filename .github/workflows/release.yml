name: Release

# Builds prebuilt binaries for macOS and Linux and publishes a GitHub release.
#
# Archive names follow GoReleaser's convention (hidepass_Darwin_arm64.tar.gz,
# ...) and checksums.txt is published beside them: youhide/homebrew-tap reads
# both from the release to regenerate the formula on its own.

on:
  push:
    tags:
      - "v*"
  # Manual runs build the archives without publishing anything.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: hidepass_Darwin_arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: hidepass_Darwin_x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: hidepass_Linux_x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            archive: hidepass_Linux_arm64
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          crate_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "v${crate_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match crate version ${crate_version}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        run: target/${{ matrix.target }}/release/hidepass --version

      - name: Package
        run: |
          mkdir -p pkg dist
          cp target/${{ matrix.target }}/release/hidepass README.md LICENSE pkg/
          tar -C pkg -czf "dist/${{ matrix.archive }}.tar.gz" hidepass README.md LICENSE

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/checksums.txt \
            --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag

